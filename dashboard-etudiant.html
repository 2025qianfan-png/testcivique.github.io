<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Tableau de bord - Association Mille Voiles</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #004080;
            --primary-light-blue: #0066cc;
            --primary-yellow: #ffd633;
            --dark-gray: #333333;
            --medium-gray: #666666;
            --light-gray: #f5f7fa;
            --white: #ffffff;
            --green: #27ae60;
            --red: #e74c3c;
            --orange: #f39c12;
            --purple: #6c5ce7;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 40px rgba(0, 0, 0, 0.12);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: var(--dark-gray);
            background: #f0f2f5;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dashboard-header .logo h1 {
            font-size: 1.5rem;
            color: var(--primary-blue);
            font-family: 'Montserrat', sans-serif;
        }

        .dashboard-header .logo h1 i {
            color: var(--primary-yellow);
        }

        .dashboard-header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .dashboard-header .user-info .badge {
            background: var(--primary-blue);
            color: white;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-header .user-info .badge.orange {
            background: var(--orange);
        }

        .dashboard-header .user-info .badge.green {
            background: var(--green);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-light-blue); }

        .btn-yellow {
            background: var(--primary-yellow);
            color: var(--primary-blue);
        }
        .btn-yellow:hover { background: #ffe066; }

        .btn-outline {
            background: transparent;
            color: var(--primary-blue);
            border: 2px solid var(--primary-blue);
        }
        .btn-outline:hover { background: var(--primary-blue); color: white; }

        .btn-danger {
            background: var(--red);
            color: white;
        }
        .btn-danger:hover { background: #c0392b; }

        .btn-success {
            background: var(--green);
            color: white;
        }
        .btn-success:hover { background: #229954; }

        .btn-sm {
            padding: 6px 16px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Montserrat', sans-serif;
        }
        .btn-sm:hover { transform: translateY(-2px); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 25px 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }

        .stat-card .stat-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .stat-card .stat-number { font-size: 2.2rem; font-weight: 700; font-family: 'Montserrat', sans-serif; }
        .stat-card .stat-label { color: var(--medium-gray); font-size: 0.85rem; margin-top: 5px; }

        .stat-card.blue .stat-number { color: var(--primary-blue); }
        .stat-card.green .stat-number { color: var(--green); }
        .stat-card.red .stat-number { color: var(--red); }
        .stat-card.orange .stat-number { color: var(--orange); }
        .stat-card.purple .stat-number { color: var(--purple); }

        .tabs-container {
            display: flex;
            gap: 5px;
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 5px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            background: transparent;
            color: var(--medium-gray);
            font-family: 'Montserrat', sans-serif;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }
        .tab-btn:hover { background: var(--light-gray); color: var(--primary-blue); }
        .tab-btn.active { background: var(--primary-blue); color: white; box-shadow: 0 4px 15px rgba(0,64,128,0.3); }

        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-container {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        .table-container h2 {
            font-size: 1.3rem;
            color: var(--primary-blue);
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        thead { background: var(--primary-blue); color: white; }
        thead th { padding: 12px 15px; text-align: left; font-weight: 600; }
        thead th:first-child { border-radius: 8px 0 0 0; }
        thead th:last-child { border-radius: 0 8px 0 0; }

        tbody tr { border-bottom: 1px solid var(--light-gray); transition: var(--transition); }
        tbody tr:hover { background: #f8f9fa; }
        tbody td { padding: 12px 15px; vertical-align: middle; }

        .status-badge {
            padding: 4px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }
        .status-badge.passed { background: rgba(39,174,96,0.15); color: var(--green); }
        .status-badge.failed { background: rgba(231,76,60,0.15); color: var(--red); }

        .score-high { color: var(--green); font-weight: 700; }
        .score-medium { color: var(--orange); font-weight: 700; }
        .score-low { color: var(--red); font-weight: 700; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-state i { font-size: 4rem; color: var(--light-gray); margin-bottom: 20px; }
        .empty-state h3 { color: var(--medium-gray); margin-bottom: 10px; }
        .empty-state p { color: var(--medium-gray); max-width: 400px; margin: 0 auto; }

        .mistake-card {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--red);
            transition: var(--transition);
        }
        .mistake-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        .mistake-card.mastered { border-left-color: var(--green); opacity: 0.85; }

        .mistake-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .mistake-card .meta .theme-tag {
            background: var(--primary-blue);
            color: white;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .mistake-card .meta .difficulty-tag {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
        }
        .difficulty-tag.easy { background: var(--green); }
        .difficulty-tag.medium { background: var(--orange); }
        .difficulty-tag.hard { background: var(--red); }

        .mistake-card .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--dark-gray);
        }

        .mistake-card .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .mistake-card .options .option {
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }
        .mistake-card .options .option.correct {
            background: rgba(39,174,96,0.1);
            border-color: var(--green);
        }
        .mistake-card .options .option.wrong {
            background: rgba(231,76,60,0.1);
            border-color: var(--red);
        }
        .mistake-card .options .option .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            background: var(--light-gray);
            color: var(--medium-gray);
        }
        .mistake-card .options .option.correct .letter { background: var(--green); color: white; }
        .mistake-card .options .option.wrong .letter { background: var(--red); color: white; }

        .mistake-card .explanation {
            background: rgba(255,214,51,0.1);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-yellow);
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--dark-gray);
        }

        .mistake-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .filter-bar {
            background: var(--white);
            border-radius: var(--border-radius);
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .filter-bar label { font-weight: 600; color: var(--primary-blue); font-size: 0.9rem; }
        .filter-bar select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Open Sans', sans-serif;
            background: white;
            min-width: 150px;
        }
        .filter-bar select:focus { outline: none; border-color: var(--primary-blue); }
        .filter-bar .filter-actions { display: flex; gap: 10px; margin-left: auto; }

        .stat-summary-box {
            background: var(--light-gray);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background: var(--white);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-hover);
            border-left: 5px solid var(--primary-blue);
            animation: slideInRight 0.3s ease-out;
            min-width: 280px;
            max-width: 450px;
        }
        .toast.success { border-left-color: var(--green); }
        .toast.error { border-left-color: var(--red); }
        .toast.warning { border-left-color: var(--orange); }
        .toast .toast-title { font-weight: 600; font-size: 0.95rem; }
        .toast .toast-message { font-size: 0.9rem; color: var(--medium-gray); margin-top: 3px; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .loading-spinner { display: none; text-align: center; padding: 40px; }
        .loading-spinner .spinner {
            border: 4px solid var(--light-gray);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .dashboard-header { flex-direction: column; text-align: center; }
            .dashboard-header .user-info { justify-content: center; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .tab-btn { padding: 10px 15px; font-size: 0.85rem; min-width: 80px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .filter-actions { margin-left: 0; justify-content: center; }
            .table-container { padding: 15px; }
            table { font-size: 0.85rem; }
            thead th, tbody td { padding: 8px 10px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 15px; }
            .stat-card .stat-number { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="dashboard-container" id="app">
    <!-- 顶部导航 -->
    <header class="dashboard-header">
        <div class="logo">
            <h1><i class="fas fa-graduation-cap"></i> Mille Voiles</h1>
        </div>
        <div class="user-info">
            <span class="badge" id="userNameBadge">
                <i class="fas fa-user"></i> <span id="studentNameDisplay">Étudiant</span>
            </span>
            <span class="badge orange" id="userTypeBadge">
                <i class="fas fa-tag"></i> <span id="studentTypeDisplay">-</span>
            </span>
            <span class="badge green" id="daysLeftBadge">
                <i class="fas fa-clock"></i> <span id="daysLeftDisplay">-</span>
            </span>
            <button class="btn btn-primary" onclick="refreshData()">
                <i class="fas fa-sync"></i> Rafraîchir
            </button>
            <button class="btn btn-yellow" onclick="goToTest()">
                <i class="fas fa-pencil-alt"></i> Passer un test
            </button>
            <button class="btn btn-outline" onclick="goBackToHome()">
                <i class="fas fa-home"></i> Accueil
            </button>
            <button class="btn btn-danger" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </button>
        </div>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card blue">
            <div class="stat-icon"><i class="fas fa-tasks"></i></div>
            <div class="stat-number" id="totalTests">0</div>
            <div class="stat-label">Tests passés / 已完成测试</div>
        </div>
        <div class="stat-card green">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-number" id="passedTests">0</div>
            <div class="stat-label">Réussis / 通过</div>
        </div>
        <div class="stat-card red">
            <div class="stat-icon"><i class="fas fa-times-circle"></i></div>
            <div class="stat-number" id="failedTests">0</div>
            <div class="stat-label">Échoués / 未通过</div>
        </div>
        <div class="stat-card orange">
            <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
            <div class="stat-number" id="averageScore">0%</div>
            <div class="stat-label">Moyenne / 平均分</div>
        </div>
        <div class="stat-card purple">
            <div class="stat-icon"><i class="fas fa-book-medical"></i></div>
            <div class="stat-number" id="totalMistakes">0</div>
            <div class="stat-label">Erreurs totales / 总错题</div>
        </div>
    </div>

    <!-- 标签切换 -->
    <div class="tabs-container">
        <button class="tab-btn active" data-tab="history" onclick="switchTab('history')">
            <i class="fas fa-history"></i> Historique / 历史
        </button>
        <button class="tab-btn" data-tab="mistakes" onclick="switchTab('mistakes')">
            <i class="fas fa-book-medical"></i> Mes erreurs / 错题集
        </button>
        <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">
            <i class="fas fa-chart-pie"></i> Statistiques / 统计
        </button>
    </div>

    <!-- 加载动画 -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <p style="color: var(--medium-gray);">Chargement des données... / 加载数据中...</p>
    </div>

    <!-- TAB 1: 历史成绩 -->
    <div class="tab-content active" id="tab-history">
        <div class="table-container">
            <h2><i class="fas fa-history"></i> Historique des scores / 成绩历史</h2>
            <div id="historyTableContainer">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <!-- TAB 2: 错题集 -->
    <div class="tab-content" id="tab-mistakes">
        <div class="filter-bar" id="filterBar">
            <label><i class="fas fa-filter"></i> Filtrer / 筛选:</label>
            <select id="filterTheme" onchange="applyFilters()">
                <option value="all">Tous les thèmes / 所有主题</option>
            </select>
            <select id="filterDifficulty" onchange="applyFilters()">
                <option value="all">Toutes difficultés / 所有难度</option>
                <option value="facile">Facile / 简单</option>
                <option value="moyen">Moyen / 中等</option>
                <option value="difficile">Difficile / 困难</option>
            </select>
            <select id="filterStatus" onchange="applyFilters()">
                <option value="all">Tous / 全部</option>
                <option value="mastered">Maîtrisés / 已掌握</option>
                <option value="not_mastered">Non maîtrisés / 未掌握</option>
            </select>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()" style="padding: 8px 20px; font-size: 0.9rem;">
                    <i class="fas fa-search"></i> Appliquer
                </button>
                <button class="btn btn-outline" onclick="resetFilters()" style="padding: 8px 20px; font-size: 0.9rem;">
                    <i class="fas fa-times"></i> Réinitialiser
                </button>
            </div>
        </div>
        <div id="mistakesListContainer">
            <!-- 由 JavaScript 动态生成 -->
        </div>
    </div>

    <!-- TAB 3: 统计 -->
    <div class="tab-content" id="tab-stats">
        <div class="table-container">
            <h2><i class="fas fa-chart-pie"></i> Analyse détaillée / 详细分析</h2>
            <div id="statsContainer">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>
    </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// 全局变量
// ============================================================
let studentInfo = { name: '', type: '', id: '', daysLeft: -1 };
let allScores = [];
let allMistakes = [];
let filteredMistakes = [];

// ============================================================
// 🔥 页面初始化
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    console.log('📊 Tableau de bord chargé');
    
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const type = urlParams.get('type');
    
    console.log('🔑 Token:', token ? token.substring(0, 30) + '...' : 'null');
    console.log('📌 Type:', type);
    
    if (token) {
        try {
            let userData;
            // 尝试多种解码方式
            try {
                const utf8String = atob(token);
                const jsonString = decodeURIComponent(utf8String);
                userData = JSON.parse(jsonString);
                console.log('✅ 方法1解析成功:', userData);
            } catch (e) {
                try {
                    userData = JSON.parse(atob(token));
                    console.log('✅ 方法2解析成功:', userData);
                } catch (e2) {
                    const decoded = decodeURIComponent(token);
                    userData = JSON.parse(decoded);
                    console.log('✅ 方法3解析成功:', userData);
                }
            }
            
            // 提取学生信息
            studentInfo.name = userData.name || userData.userId || userData.student_name || 'Étudiant';
            studentInfo.type = type || userData.type || userData.userType || 't';
            studentInfo.id = userData.id || userData.userId || userData.student_id || null;
            studentInfo.daysLeft = userData.daysLeft || userData.days_left || -1;
            
            console.log('✅ 学生信息:', studentInfo);
            
            // 更新界面
            document.getElementById('studentNameDisplay').textContent = studentInfo.name;
            document.getElementById('studentTypeDisplay').textContent = getTypeLabel(studentInfo.type);
            
            if (studentInfo.daysLeft > 0) {
                document.getElementById('daysLeftDisplay').textContent = studentInfo.daysLeft + ' jours';
            } else if (studentInfo.daysLeft === -1) {
                document.getElementById('daysLeftDisplay').textContent = 'Illimité';
            } else {
                document.getElementById('daysLeftDisplay').textContent = 'Expiré';
            }
            
            // 保存到 sessionStorage
            saveSession();
            
            // 🔥 加载数据
            loadAllData();
            
        } catch (error) {
            console.error('❌ Token解析失败:', error);
            showToast('Erreur', 'Impossible de charger les données. Veuillez vous reconnecter.', 'error');
            setTimeout(() => { window.location.href = 'examen-civique.html'; }, 2000);
        }
    } else {
        // 尝试从 sessionStorage 恢复
        try {

// ============================================================
// 🔥 加载成绩（增强版 - 同时从本地和 Supabase 读取）
// ============================================================
// ============================================================
// 🔥 加载成绩（合并本地 + Supabase）
// ============================================================
async function loadScores() {
    let supabaseScores = [];
    let localScores = [];
    
    console.log('📊 开始加载成绩，学生:', studentInfo.name);
    
    // 1. 从 Supabase 获取成绩
    try {
        if (window.supabaseAuth && window.supabaseAuth.getStudentScores) {
            const data = await window.supabaseAuth.getStudentScores(studentInfo.name);
            if (data && data.length > 0) {
                supabaseScores = data;
                console.log('✅ 从 Supabase 加载成绩:', supabaseScores.length, '条');
            } else {
                console.log('ℹ️ Supabase 没有成绩数据');
            }
        }
    } catch (e) {
        console.warn('⚠️ Supabase 加载失败:', e.message);
    }
    
    // 2. 从本地读取成绩（无论 Supabase 是否有数据）
    try {
        const key = `test_scores_${studentInfo.name}`;
        const localData = localStorage.getItem(key);
        if (localData) {
            const parsed = JSON.parse(localData);
            if (parsed && parsed.length > 0) {
                localScores = parsed;
                console.log('✅ 从本地加载成绩:', localScores.length, '条');
            }
        }
    } catch (e) {
        console.warn('⚠️ 本地加载失败:', e.message);
    }
    
    // 3. 合并数据（去重）
    const allScores = [...supabaseScores];
    const existingIds = new Set();
    
    // 记录已有的 id（或 student_name + test_date 组合）
    supabaseScores.forEach(s => {
        const key = s.id || `${s.student_name}_${s.test_date}`;
        existingIds.add(key);
    });
    
    // 添加本地数据（去重）
    let addedCount = 0;
    localScores.forEach(local => {
        const localKey = local.id || `${local.student_name}_${local.test_date}`;
        if (!existingIds.has(localKey)) {
            // 标记为本地数据
            local.local_only = true;
            allScores.push(local);
            existingIds.add(localKey);
            addedCount++;
        }
    });
    
    if (addedCount > 0) {
        console.log(`🔄 合并了 ${addedCount} 条本地数据`);
    }
    
    // 4. 按日期降序排列
    allScores.sort((a, b) => {
        const dateA = new Date(a.test_date || a.created_at || 0);
        const dateB = new Date(b.test_date || b.created_at || 0);
        return dateB - dateA;
    });
    
    // 5. 确保数据格式正确
    const finalScores = allScores.map(s => {
        if (!s.percentage && s.score !== undefined && s.total !== undefined) {
            s.percentage = Math.round((s.score / s.total) * 100);
        }
        if (s.passed === undefined && s.score !== undefined) {
            s.passed = s.score >= 32;
        }
        if (!s.test_date) {
            s.test_date = s.created_at || new Date().toISOString();
        }
        return s;
    });
    
    console.log('📊 最终合并成绩:', finalScores.length, '条');
    console.log('📊 数据库:', supabaseScores.length, '条，本地:', localScores.length, '条');
    
    return finalScores;
}

// 加载错题
// ============================================================
async function loadMistakes() {
    let mistakes = [];
    
    try {
        if (window.supabaseAuth && window.supabaseAuth.getStudentMistakes) {
            const data = await window.supabaseAuth.getStudentMistakes(studentInfo.name);
            if (data && data.length > 0) {

            }
        }
    } catch (e) {
        console.warn('⚠️ Supabase 错题加载失败:', e.message);
    }
    
    // 如果 Supabase 没有数据，从本地读取
    if (mistakes.length === 0) {
        try {
            const key = `mistakes_${studentInfo.name}`;
            const localData = localStorage.getItem(key);
            if (localData) {
                const parsed = JSON.parse(localData);
                if (parsed.length > 0) {
                    mistakes = parsed;
                    console.log('✅ 从本地加载错题:', mistakes.length);
                }
            }
        } catch (e) {

        }
    }
    
    return mistakes;
}

// ============================================================
// 更新统计
// ============================================================
function updateStats() {
    const total = allScores.length;
    const passed = allScores.filter(s => s.passed || (s.score && s.score >= 32)).length;
    const failed = total - passed;
    
    let avg = 0;
    if (total > 0) {
        const sum = allScores.reduce((acc, s) => {
            const pct = s.percentage || (s.score && s.total ? Math.round((s.score / s.total) * 100) : 0);
            return acc + pct;
        }, 0);
        avg = Math.round(sum / total);
    }
    
    // 计算错题总数（去重）
    const uniqueMistakes = new Set();
    allMistakes.forEach(m => {
        const key = m.question_id || m.question || 'unknown';
        uniqueMistakes.add(key);
    });
    
    document.getElementById('totalTests').textContent = total;
    document.getElementById('passedTests').textContent = passed;
    document.getElementById('failedTests').textContent = failed;
    document.getElementById('averageScore').textContent = total > 0 ? avg + '%' : '0%';
    document.getElementById('totalMistakes').textContent = uniqueMistakes.size;
}

// ============================================================
// 从错题计算主题统计
// ============================================================
function calculateThemeStatsFromMistakes() {
    const distribution = {};
    const accuracy = {};
    const totalByTheme = {};
    const correctByTheme = {};
    
    allMistakes.forEach(m => {
        const theme = m.category || m.theme || 'Autre';
        distribution[theme] = (distribution[theme] || 0) + 1;
        totalByTheme[theme] = (totalByTheme[theme] || 0) + 1;
        if (m.mastered) {
            correctByTheme[theme] = (correctByTheme[theme] || 0) + 1;
        }
    });
    
    Object.keys(totalByTheme).forEach(theme => {
        const total = totalByTheme[theme] || 0;
        const correct = correctByTheme[theme] || 0;
        accuracy[theme] = total > 0 ? Math.round((correct / total) * 100) : 0;
    });
    
    return { distribution, accuracy };
}

function applyFilters() {
    const theme = document.getElementById('filterTheme').value;
    const difficulty = document.getElementById('filterDifficulty').value;
    const status = document.getElementById('filterStatus').value;
    
    filteredMistakes = allMistakes.filter(m => {
        if (theme !== 'all' && (m.category || m.theme || 'Autre') !== theme) return false;
        if (difficulty !== 'all' && (m.difficulty || 'moyen') !== difficulty) return false;
        if (status === 'mastered' && !m.mastered) return false;
        if (status === 'not_mastered' && m.mastered) return false;
        return true;
    });
    renderMistakesList();
}

function resetFilters() {
    document.getElementById('filterTheme').value = 'all';
    document.getElementById('filterDifficulty').value = 'all';
    document.getElementById('filterStatus').value = 'all';
    filteredMistakes = [...allMistakes];
    renderMistakesList();
}

// ============================================================
// 错题操作
// ============================================================
async function toggleMastered(mistakeId, mastered) {
    try {
        if (window.supabaseAuth && window.supabaseAuth.markMistakeAsMastered) {
            await window.supabaseAuth.markMistakeAsMastered(mistakeId, mastered);
        }
        const mistake = allMistakes.find(m => m.id === mistakeId);
        if (mistake) mistake.mastered = mastered;
        applyFilters();
        updateStats();
        showToast('Succès', mastered ? 'Question maîtrisée!' : 'Question non maîtrisée.', 'success');
    } catch (error) {
        console.error('更新状态失败:', error);
        showToast('Erreur', 'Impossible de mettre à jour.', 'error');
    }
}

async function deleteMistake(mistakeId) {
    if (!confirm('Supprimer cette erreur ? / 删除此错题？')) return;
    try {
        if (window.supabaseAuth && window.supabaseAuth.deleteMistake) {
            await window.supabaseAuth.deleteMistake(mistakeId);
        }
        allMistakes = allMistakes.filter(m => m.id !== mistakeId);
        filteredMistakes = filteredMistakes.filter(m => m.id !== mistakeId);
        renderMistakesList();
        updateStats();
        showToast('Succès', 'Erreur supprimée!', 'success');
    } catch (error) {
        console.error('删除失败:', error);
        showToast('Erreur', 'Impossible de supprimer.', 'error');
    }
}

async function clearAllMistakes() {
    if (!confirm('Supprimer toutes les erreurs ? / 删除所有错题？')) return;
    try {
        if (window.supabaseAuth && window.supabaseAuth.clearAllMistakes) {
            await window.supabaseAuth.clearAllMistakes(studentInfo.name);
        }
        allMistakes = [];
        filteredMistakes = [];
        renderMistakesList();
        updateStats();
        showToast('Succès', 'Toutes les erreurs ont été supprimées!', 'success');
    } catch (error) {
        console.error('清空失败:', error);
        showToast('Erreur', 'Impossible de supprimer.', 'error');
    }
}

function viewMistakeDetail(mistakeId) {
    const mistake = allMistakes.find(m => m.id === mistakeId);
    if (!mistake) return;
    const optionLetters = ['A', 'B', 'C', 'D'];
    let optionsStr = '';
    (mistake.options || []).forEach((opt, idx) => {
        const isCorrect = idx === mistake.correct_answer;
        const isUser = idx === mistake.user_answer;
        let marker = '';
        if (isCorrect) marker = ' ✅';
        if (isUser && !isCorrect) marker = ' ❌';
        optionsStr += `\n   ${optionLetters[idx]}. ${opt}${marker}`;
    });
    alert(
        `📝 QUESTION / 题目:\n${mistake.question}\n\n` +
        `📋 OPTIONS / 选项:${optionsStr}\n\n` +
        `🏷️ Thème: ${mistake.category || mistake.theme || 'Autre'}\n` +
        `📊 Difficulté: ${mistake.difficulty || 'Moyen'}\n` +
        `❌ Erreurs: ${mistake.times_wrong || 1} fois\n` +
        `📌 Statut: ${mistake.mastered ? '✅ Maîtrisé' : '📝 À réviser'}\n` +
        (mistake.explanation ? `\n📖 Explication:\n${mistake.explanation}` : '')
    );
}

// ============================================================
// 工具函数
// ============================================================
function getDifficultyClass(difficulty) {
    if (!difficulty) return 'medium';
    const d = difficulty.toLowerCase();
    if (d.includes('facile') || d.includes('easy') || d.includes('simple')) return 'easy';
    if (d.includes('difficile') || d.includes('hard')) return 'hard';
    return 'medium';
}

function formatExplanation(text) {
    if (!text) return '';
    return text.replace(/\n/g, '<br>');
}

function showLoading(show) {
    document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
}

function showToast(title, message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-message">${message}</div>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
}

function refreshData() {
    showToast('Info', 'Rafraîchissement des données...', 'info');
    loadAllData();
}

function goToTest() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const type = urlParams.get('type');
    let testUrl = 'test-etudiant.html';
    if (token) {
        testUrl += `?token=${encodeURIComponent(token)}`;
        if (type) testUrl += `&type=${type}`;
    }
    window.location.href = testUrl;
}

function goBackToHome() {
    if (confirm('Retourner à l\'accueil ? / 返回主页？')) {
        window.location.href = 'examen-civique.html';
    }
}

function logout() {
    if (confirm('Se déconnecter ? / 退出登录？')) {
        sessionStorage.removeItem('student_dashboard_data');
        localStorage.removeItem('student_dashboard_data');
        window.location.href = 'examen-civique.html';
    }
}

// 暴露全局
window.dashboard = {
    loadAllData, refreshData, goToTest, goBackToHome, logout,
    switchTab, applyFilters, resetFilters,
    toggleMastered, deleteMistake, clearAllMistakes,
    studentInfo, allScores, allMistakes
};

console.log('✅ Tableau de bord chargé');
console.log('📊 可用函数:', Object.keys(window.dashboard));
