<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⛵ 千帆课堂 - 视频会议</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.1/dist/peerjs.min.js">
    </script>
    <style>
        /* ===== 样式表（与之前相同，省略节省篇幅） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-blue: #004080;
            --primary-light-blue: #0066cc;
            --primary-yellow: #ffd633;
            --green: #27ae60;
            --red: #e74c3c;
            --gray: #95a5a6;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 16px;
        }
        html,
        body {
            height: 100%;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }
        }
        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light-blue));
            color: white;
            padding: 14px 0;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .brand .logo-icon {
            font-size: 1.6rem;
            color: var(--primary-yellow);
        }
        .header .brand h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        .header .brand .sub {
            font-size: 0.6rem;
            opacity: 0.8;
            display: block;
        }
        .header .brand .sub span {
            color: var(--primary-yellow);
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .header .brand h1 {
                font-size: 0.95rem;
            }
            .header .brand .logo-icon {
                font-size: 1.3rem;
            }
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header .info .room {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
        }
        .header .info .user {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
        }
        .header .info .user .tag {
            background: rgba(255, 255, 255, 0.25);
            padding: 1px 6px;
            border-radius: 20px;
            font-size: 0.5rem;
            font-weight: 600;
        }
        .btn-exit {
            background: var(--red);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.6rem;
            transition: all 0.2s;
        }
        .btn-exit:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .header.hidden-fs {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 0 24px 0;
        }
        .join-panel {
            max-width: 400px;
            margin: auto;
            background: white;
            border-radius: var(--radius);
            padding: 32px 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            width: 100%;
        }
        .join-panel .icon {
            font-size: 2.5rem;
            color: var(--primary-yellow);
            margin-bottom: 10px;
        }
        .join-panel h2 {
            color: var(--primary-blue);
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .join-panel p {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 16px;
        }
        .join-panel input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e4e8;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .join-panel input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 64, 128, 0.08);
        }
        .join-panel .btn-join {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light-blue));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .join-panel .btn-join:hover {
            transform: scale(1.01);
            filter: brightness(0.95);
        }
        .join-panel .hint {
            margin-top: 12px;
            color: #aaa;
            font-size: 0.7rem;
        }
        .join-panel .hint i {
            color: var(--primary-yellow);
        }
        .join-panel .hint .teacher-hint {
            color: var(--primary-yellow);
            font-weight: 600;
            background: rgba(255, 214, 51, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            flex: 1;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid var(--primary-yellow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading p {
            margin-top: 14px;
            color: #999;
            font-size: 0.85rem;
        }
        #videoRoom {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-video {
            position: relative;
            background: #0f0f1a;
            border-radius: var(--radius);
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 10;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            flex-shrink: 0;
        }
        .main-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #1a1a2e;
        }
        .main-video .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: white;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
            pointer-events: none;
        }
        .main-video .label i {
            color: var(--primary-yellow);
        }
        .main-video .status {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #2ecc71;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }
        .main-video .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .main-video .status.offline {
            color: var(--gray);
        }
        .main-video .status.offline .dot {
            background: var(--gray);
        }
        .main-video:fullscreen,
        .main-video:-webkit-full-screen {
            border-radius: 0 !important;
            aspect-ratio: auto !important;
            height: 100vh !important;
            width: 100vw !important;
            background: #000 !important;
            cursor: default !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 99999 !important;
        }
        .main-video:fullscreen video,
        .main-video:-webkit-full-screen video {
            object-fit: contain !important;
        }
        .main-video:fullscreen .label,
        .main-video:-webkit-full-screen .label {
            font-size: 0.9rem;
            padding: 6px 16px;
        }
        .main-video:fullscreen .status,
        .main-video:-webkit-full-screen .status {
            font-size: 0.75rem;
            padding: 4px 12px;
        }
        .main-video:fullscreen .pip,
        .main-video:-webkit-full-screen .pip {
            width: 200px;
            bottom: 24px;
            right: 24px;
        }
        .pip {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 140px;
            aspect-ratio: 4 / 3;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a2e;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.12);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .pip:hover {
            transform: scale(1.04);
            border-color: var(--primary-yellow);
        }
        .pip video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #1a1a2e;
        }
        .pip .pip-label {
            position: absolute;
            bottom: 4px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.5rem;
            color: white;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .pip .pip-label i {
            color: var(--primary-yellow);
            margin-right: 2px;
        }
        @media (max-width: 480px) {
            .pip {
                width: 90px;
            }
            .main-video:fullscreen .pip,
            .main-video:-webkit-full-screen .pip {
                width: 130px;
            }
        }
        .controls {
            background: white;
            border-radius: var(--radius);
            padding: 12px 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }
        .controls .ctrl-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 60px;
            justify-content: center;
            background: #eef0f3;
            color: #333;
        }
        .controls .ctrl-btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }
        .controls .ctrl-btn.mic {
            background: #eef0f3;
            color: #333;
        }
        .controls .ctrl-btn.mic.muted {
            background: #e74c3c;
            color: white;
        }
        .controls .ctrl-btn.cam {
            background: #eef0f3;
            color: #333;
        }
        .controls .ctrl-btn.cam.off {
            background: #e74c3c;
            color: white;
        }
        .controls .ctrl-btn.screen {
            background: var(--green);
            color: white;
        }
        .controls .ctrl-btn.screen.active {
            background: var(--red);
            color: white;
        }
        .controls .ctrl-btn.fullscreen {
            background: #533483;
            color: white;
        }
        .controls .ctrl-btn.fullscreen.active {
            background: #2c3e50;
            color: white;
        }
        .controls .ctrl-btn.hangup {
            background: var(--red);
            color: white;
        }
        @media (max-width: 480px) {
            .controls .ctrl-btn {
                padding: 6px 10px;
                font-size: 0.65rem;
                min-width: 45px;
            }
        }
        .status-bar {
            text-align: center;
            padding: 6px 14px;
            border-radius: var(--radius);
            background: white;
            box-shadow: var(--shadow);
            font-size: 0.75rem;
            color: #666;
            flex-shrink: 0;
        }
        .status-bar .text {
            font-weight: 500;
        }
        .status-bar .text.success {
            color: var(--green);
        }
        .status-bar .text.warning {
            color: #f39c12;
        }
        .status-bar .text.error {
            color: var(--red);
        }
        .status-bar .text.info {
            color: var(--primary-blue);
        }
        .footer {
            background: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 12px 0;
            flex-shrink: 0;
            margin-top: auto;
        }
        .footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
        }
        .footer .container .brand-small {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .footer .container .brand-small i {
            color: var(--primary-yellow);
        }
        @media (max-width: 480px) {
            .footer .container {
                flex-direction: column;
                text-align: center;
                font-size: 0.6rem;
            }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
            max-width: 320px;
            font-size: 0.8rem;
        }
        @media (max-width: 480px) {
            .toast {
                bottom: 10px;
                right: 10px;
                left: 10px;
                padding: 6px 12px;
                font-size: 0.7rem;
            }
        }
        .toast-success {
            background: var(--green);
        }
        .toast-error {
            background: var(--red);
        }
        .toast-warning {
            background: #f39c12;
        }
        .toast-info {
            background: var(--primary-blue);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header" id="mainHeader">
        <div class="container">
            <div class="brand">
                <span class="logo-icon"><i class="fas fa-sailboat"></i></span>
                <div>
                    <h1>⛵ 千帆课堂</h1>
                    <span class="sub">Association <span>Mille Voiles</span> · 在线课堂</span>
                </div>
            </div>
            <div class="info">
                <span class="room" id="roomDisplay"><i class="fas fa-door-open"></i> <strong id="roomName">加载中...</strong></span>
                <span class="user hidden" id="userBadge">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">-</span>
                    <span class="tag" id="userRole">-</span>
                </span>
                <button class="btn-exit" id="exitBtn"><i class="fas fa-sign-out-alt"></i> 退出</button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container">

        <div id="joinPanel" class="join-panel">
            <div class="icon"><i class="fas fa-sailboat"></i></div>
            <h2>⛵ 千帆课堂</h2>
            <p>输入你的名字进入课堂</p>
            <input type="text" id="nameInput" placeholder="你的名字" maxlength="30">
            <button class="btn-join" id="joinBtn"><i class="fas fa-video"></i> 进入</button>
            <div class="hint">
                <i class="fas fa-info-circle"></i>
                输入 <span class="teacher-hint">millevoiles</span> 成为老师，其他名字为学生
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingText">⏳ 连接中...</p>
        </div>

        <div id="videoRoom" class="hidden">

            <div class="main-video" id="mainVideo">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label" id="remoteLabel">
                    <i class="fas fa-user"></i> 等待中...
                </div>
                <div class="status offline" id="remoteStatus">
                    <span class="dot"></span> 未连接
                </div>

                <div class="pip" id="pipWrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="pip-label"><i class="fas fa-user"></i> <span id="localLabel">我</span></div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn mic" id="micBtn"><i class="fas fa-microphone"></i> 麦克风</button>
                <button class="ctrl-btn cam" id="camBtn"><i class="fas fa-video"></i> 摄像头</button>
                <button class="ctrl-btn screen" id="screenBtn"><i class="fas fa-desktop"></i> 共享屏幕</button>
                <button class="ctrl-btn fullscreen" id="fsControlBtn">
                    <i class="fas fa-expand"></i> 全屏
                </button>
                <button class="ctrl-btn hangup" id="hangupBtn"><i class="fas fa-phone-slash"></i> 挂断</button>
            </div>

            <div class="status-bar">
                <span class="text info" id="statusText">就绪</span>
            </div>
        </div>

    </main>

    <footer class="footer">
        <div class="container">
            <span class="brand-small"><i class="fas fa-sailboat"></i> ⛵ 千帆课堂 · Association Mille Voiles</span>
            <span>&copy; 2025 保留所有权利</span>
        </div>
    </footer>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 配置
            // ============================================================
            const ROOM_ID = 'mille-voiles-classroom';
            const TEACHER_NAME = 'millevoiles';

            const PEER_CONFIG = {
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' },
                        {
                            urls: [
                                'turn:openrelay.metered.ca:80',
                                'turn:openrelay.metered.ca:443',
                                'turn:openrelay.metered.ca:443?transport=tcp'
                            ],
                            username: 'openrelayproject',
                            credential: 'openrelayproject'
                        },
                        {
                            urls: [
                                'turn:turn.xirsys.com:3478?transport=udp',
                                'turn:turn.xirsys.com:3478?transport=tcp',
                                'turn:turn.xirsys.com:443?transport=tcp'
                            ],
                            username: 'f3f5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5',
                            credential: 'f3f5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5'
                        }
                    ],
                    iceCandidatePoolSize: 10,
                    bundlePolicy: 'max-bundle',
                    rtcpMuxPolicy: 'require'
                }
            };

            // ============================================================
            //  2. DOM 引用
            // ============================================================
            const joinPanel = document.getElementById('joinPanel');
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');
            const videoRoom = document.getElementById('videoRoom');
            const nameInput = document.getElementById('nameInput');
            const joinBtn = document.getElementById('joinBtn');
            const roomDisplay = document.getElementById('roomDisplay');
            const exitBtn = document.getElementById('exitBtn');
            const userBadge = document.getElementById('userBadge');
            const userName = document.getElementById('userName');
            const userRole = document.getElementById('userRole');

            const localVideo = document.getElementById('localVideo');
            const remoteVideo = document.getElementById('remoteVideo');
            const localLabel = document.getElementById('localLabel');
            const remoteLabel = document.getElementById('remoteLabel');
            const remoteStatus = document.getElementById('remoteStatus');
            const statusText = document.getElementById('statusText');

            const micBtn = document.getElementById('micBtn');
            const camBtn = document.getElementById('camBtn');
            const screenBtn = document.getElementById('screenBtn');
            const fsControlBtn = document.getElementById('fsControlBtn');
            const hangupBtn = document.getElementById('hangupBtn');
            const mainVideo = document.getElementById('mainVideo');

            // ============================================================
            //  3. 状态
            // ============================================================
            let peer = null;
            let call = null;
            let localStream = null;
            let remoteStream = null;
            let isScreenSharing = false;
            let myRole = null;
            let myName = '';
            let isConnected = false;
            let reconnectTimer = null;
            let retryCount = 0;
            const MAX_RETRY = 10;

            // ============================================================
            //  4. 全屏
            // ============================================================
            const header = document.getElementById('mainHeader');
            let isFullscreen = false;

            function toggleFullscreen() {
                const el = mainVideo;
                const isFS = document.fullscreenElement ||
                    document.webkitFullscreenElement ||
                    (el.webkitDisplayingFullscreen !== undefined && el.webkitDisplayingFullscreen);

                if (!isFS) {
                    try {
                        if (el.requestFullscreen) {
                            el.requestFullscreen().then(() => {
                                header.classList.add('hidden-fs');
                                updateFSButton(true);
                            }).catch(() => {});
                        } else if (el.webkitRequestFullscreen) {
                            el.webkitRequestFullscreen();
                            header.classList.add('hidden-fs');
                            updateFSButton(true);
                        } else {
                            const video = el.querySelector('video');
                            if (video && video.webkitEnterFullscreen) {
                                video.webkitEnterFullscreen();
                                header.classList.add('hidden-fs');
                                updateFSButton(true);
                            } else {
                                showToast('您的浏览器不支持全屏', 'warning');
                            }
                        }
                    } catch (e) {
                        const video = el.querySelector('video');
                        if (video && video.webkitEnterFullscreen) {
                            video.webkitEnterFullscreen();
                            header.classList.add('hidden-fs');
                            updateFSButton(true);
                        } else {
                            showToast('错误: ' + e.message, 'error');
                        }
                    }
                } else {
                    try {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        else {
                            const video = el.querySelector('video');
                            if (video && video.webkitExitFullscreen) video.webkitExitFullscreen();
                        }
                        header.classList.remove('hidden-fs');
                        updateFSButton(false);
                    } catch (e) {
                        header.classList.remove('hidden-fs');
                        updateFSButton(false);
                    }
                }
            }

            function updateFSButton(isFS) {
                isFullscreen = isFS;
                if (isFS) {
                    fsControlBtn.innerHTML = '<i class="fas fa-compress"></i> 退出';
                    fsControlBtn.classList.add('active');
                } else {
                    fsControlBtn.innerHTML = '<i class="fas fa-expand"></i> 全屏';
                    fsControlBtn.classList.remove('active');
                }
            }

            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    header.classList.remove('hidden-fs');
                    updateFSButton(false);
                }
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement) {
                    header.classList.remove('hidden-fs');
                    updateFSButton(false);
                }
            });

            fsControlBtn.addEventListener('click', toggleFullscreen);
            mainVideo.addEventListener('dblclick', toggleFullscreen);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && (document.fullscreenElement || document.webkitFullscreenElement)) {
                    header.classList.remove('hidden-fs');
                    updateFSButton(false);
                }
            });

            // ============================================================
            //  5. UI 工具
            // ============================================================
            function setStatus(text, type) {
                statusText.textContent = text;
                statusText.className = 'text ' + (type || 'info');
            }

            function setRemoteOnline(online) {
                if (online) {
                    remoteStatus.className = 'status';
                    remoteStatus.innerHTML = '<span class="dot"></span> 已连接';
                } else {
                    remoteStatus.className = 'status offline';
                    remoteStatus.innerHTML = '<span class="dot"></span> 未连接';
                }
            }

            function showToast(msg, type) {
                const old = document.querySelector('.toast');
                if (old) old.remove();
                const el = document.createElement('div');
                el.className = 'toast toast-' + (type || 'info');
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle' };
                el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }

            function updateRoom() {
                roomDisplay.innerHTML = `<i class="fas fa-door-open"></i> 房间: <strong>${ROOM_ID}</strong>`;
            }

            function updateUser(name, role) {
                userBadge.classList.remove('hidden');
                userName.textContent = name;
                const labels = { teacher: '👨‍🏫 老师', student: '🎓 学生' };
                userRole.textContent = labels[role] || role;
                userRole.style.background = role === 'teacher' ? 'rgba(255,214,51,0.3)' :
                    'rgba(46,204,113,0.3)';
            }

            // ============================================================
            //  6. URL 参数
            // ============================================================
            function getURLParam(name) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }

            function decodeToken() {
                const token = getURLParam('token');
                if (!token) return null;
                try {
                    const jsonStr = decodeURIComponent(atob(token));
                    return JSON.parse(jsonStr);
                } catch (e) { return null; }
            }

            function getRole(token) {
                if (!token) return null;
                if (token.role === 'teacher' || token.role === 'student') return token.role;
                if (token.teacherId || token.teacher_id) return 'teacher';
                if (token.studentId || token.student_id || token.userId) return 'student';
                return null;
            }

            function getName(token) {
                if (!token) return null;
                return token.name || token.userName || token.studentName || '用户';
            }

            // ============================================================
            //  7. 加入逻辑
            // ============================================================
            function initJoin() {
                const tokenData = decodeToken();
                if (tokenData) {
                    const role = getRole(tokenData);
                    const name = getName(tokenData);
                    if (role && name) {
                        myName = name;
                        myRole = role;
                        joinPanel.classList.add('hidden');
                        loading.classList.remove('hidden');
                        loadingText.textContent = `⏳ 认证 ${role === 'teacher' ? '老师' : '学生'}...`;
                        setTimeout(() => {
                            loading.classList.add('hidden');
                            videoRoom.classList.remove('hidden');
                            localLabel.textContent = myName;
                            updateRoom();
                            updateUser(myName, myRole);
                            startPeer();
                        }, 500);
                        return;
                    }
                }

                const forceRole = getURLParam('role');
                if (forceRole === 'teacher' || forceRole === 'student') {
                    myRole = forceRole;
                    myName = forceRole === 'teacher' ? '老师' : '学生';
                    joinPanel.classList.add('hidden');
                    videoRoom.classList.remove('hidden');
                    localLabel.textContent = myName;
                    updateRoom();
                    updateUser(myName, myRole);
                    startPeer();
                    return;
                }

                joinPanel.classList.remove('hidden');
                loading.classList.add('hidden');
                videoRoom.classList.add('hidden');
                userBadge.classList.add('hidden');
            }

            joinBtn.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (!name) {
                    showToast('请输入你的名字', 'warning');
                    return;
                }

                myName = name;

                if (name.toLowerCase() === TEACHER_NAME.toLowerCase()) {
                    myRole = 'teacher';
                } else {
                    myRole = 'student';
                }

                joinPanel.classList.add('hidden');
                videoRoom.classList.remove('hidden');
                localLabel.textContent = myName;
                updateRoom();
                updateUser(myName, myRole);

                if (myRole === 'teacher') {
                    showToast('👨‍🏫 欢迎老师！', 'success');
                    setStatus('👨‍🏫 以老师身份进入...', 'info');
                } else {
                    showToast('🎓 欢迎同学！', 'info');
                    setStatus('🎓 以学生身份进入...', 'info');
                }

                startPeer();
            });

            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') joinBtn.click();
            });

            exitBtn.addEventListener('click', () => {
                if (confirm('确定要退出课堂吗？')) {
                    hangup();
                    window.location.href = window.location.pathname;
                }
            });

            // ============================================================
            //  8. PeerJS
            // ============================================================
            function startPeer() {
                const peerId = (myRole === 'teacher') ? ROOM_ID : undefined;
                setStatus('连接到服务器...', 'info');

                if (peer) {
                    peer.destroy();
                    peer = null;
                }

                peer = new Peer(peerId, PEER_CONFIG);

                peer.on('open', (id) => {
                    console.log('✅ Peer 已打开, ID:', id, '角色:', myRole);
                    retryCount = 0;

                    if (myRole === 'teacher') {
                        setupTeacher();
                    } else {
                        setupStudent();
                    }
                });

                peer.on('error', (err) => {
                    console.error('❌ Peer 错误:', err.type, err.message);

                    if (err.type === 'unavailable-id') {
                        if (myRole === 'teacher') {
                            setStatus('⚠️ 已有一位老师，请用其他名字作为学生进入', 'error');
                            showToast('老师已在线，请用其他名字作为学生进入', 'error');
                        }
                    } else if (err.type === 'peer-unavailable') {
                        if (myRole === 'student') {
                            setStatus('⏳ 老师不在线，等待中...', 'warning');
                            showToast('老师不在线，等待中...', 'warning');
                            scheduleReconnect();
                        }
                    } else if (err.type === 'network' || err.type === 'server') {
                        setStatus('⚠️ 网络错误，尝试重连...', 'warning');
                        scheduleReconnect();
                    } else {
                        setStatus('错误: ' + err.message, 'error');
                        showToast('错误: ' + err.message, 'error');
                    }
                });

                peer.on('disconnected', () => {
                    console.log('⚠️ Peer 断开连接');
                    setStatus('⚠️ 连接断开，尝试重连...', 'warning');
                    if (peer) {
                        peer.reconnect();
                    }
                });

                peer.on('close', () => {
                    console.log('📴 Peer 已关闭');
                });
            }

            // ============================================================
            //  9. ⭐ 老师设置（修复版）
            // ============================================================
            function setupTeacher() {
                setStatus('📷 正在打开摄像头...', 'info');

                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        localStream = stream;
                        localVideo.srcObject = stream;
                        // ⭐ 强制播放本地视频
                        localVideo.play().catch(e => console.warn('本地视频播放:', e));
                        console.log('✅ 老师摄像头已就绪, 视频轨道:', stream.getVideoTracks().length);

                        // ⭐ 关键：监听来电，但只处理一次，避免重复
                        peer.on('call', (incoming) => {
                            console.log('📞 收到学生来电！', incoming);

                            // ⭐ 如果有旧通话，先关闭
                            if (call) {
                                console.log('⚠️ 关闭旧通话');
                                call.close();
                                call = null;
                            }

                            remoteLabel.innerHTML = '<i class="fas fa-user"></i> 学生';
                            setRemoteOnline(true);
                            setStatus('✅ 已连接学生', 'success');
                            showToast('🎓 有学生加入了课堂！', 'success');

                            if (localStream) {
                                // ⭐ 回答呼叫
                                incoming.answer(localStream);

                                // ⭐ 设置通话
                                setupCall(incoming);
                                call = incoming;
                            } else {
                                // 安全兜底
                                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                                    .then(s => {
                                        localStream = s;
                                        localVideo.srcObject = s;
                                        localVideo.play().catch(e => console.warn('本地视频播放:', e));
                                        incoming.answer(s);
                                        setupCall(incoming);
                                        call = incoming;
                                    })
                                    .catch(err => {
                                        setStatus('❌ 摄像头获取失败', 'error');
                                        showToast('无法获取摄像头', 'error');
                                    });
                            }
                        });

                        setStatus('👨‍🏫 老师在线，等待学生加入...', 'info');
                    })
                    .catch(err => {
                        console.error('老师摄像头错误:', err);
                        setStatus('❌ 无法访问摄像头，仅音频模式', 'warning');
                        showToast('请授权摄像头和麦克风权限', 'warning');

                        // 无摄像头降级
                        peer.on('call', (incoming) => {
                            console.log('📞 收到来电（无摄像头模式）');

                            if (call) {
                                call.close();
                                call = null;
                            }

                            try {
                                const audioCtx = new AudioContext();
                                const dest = audioCtx.createMediaStreamDestination();
                                const emptyStream = dest.stream;
                                localStream = emptyStream;
                                localVideo.srcObject = emptyStream;
                                incoming.answer(emptyStream);
                                setupCall(incoming);
                                call = incoming;
                                setStatus('⚠️ 无摄像头，音频模式', 'warning');
                                showToast('摄像头不可用，仅音频模式', 'warning');
                            } catch (e) {
                                showToast('无法建立连接', 'error');
                            }
                        });
                        setStatus('👨‍🏫 老师在线（无摄像头），等待学生...', 'info');
                    });
            }

            // ============================================================
            //  10. 学生设置
            // ============================================================
            function setupStudent() {
                setStatus('📷 正在打开摄像头...', 'info');

                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        localStream = stream;
                        localVideo.srcObject = stream;
                        localVideo.play().catch(e => console.warn('本地视频播放:', e));
                        console.log('✅ 学生摄像头已就绪, 视频轨道:', stream.getVideoTracks().length);

                        setStatus('📞 正在呼叫老师...', 'info');
                        callTeacher();
                    })
                    .catch(err => {
                        console.error('学生摄像头错误:', err);
                        setStatus('❌ 无法访问摄像头，仅音频模式', 'warning');
                        showToast('请授权摄像头和麦克风权限', 'warning');

                        try {
                            const audioCtx = new AudioContext();
                            const dest = audioCtx.createMediaStreamDestination();
                            localStream = dest.stream;
                            localVideo.srcObject = dest.stream;
                            setStatus('📞 正在呼叫老师（仅音频）...', 'info');
                            callTeacher();
                        } catch (e) {
                            setStatus('❌ 无法建立连接', 'error');
                            showToast('无法访问摄像头和麦克风', 'error');
                        }
                    });
            }

            // ============================================================
            //  11. 学生呼叫老师
            // ============================================================
            function callTeacher() {
                if (!peer) {
                    scheduleReconnect();
                    return;
                }

                if (!peer.id) {
                    setStatus('⏳ 等待连接建立...', 'info');
                    setTimeout(() => callTeacher(), 1000);
                    return;
                }

                console.log('📞 呼叫老师:', ROOM_ID);

                try {
                    // ⭐ 如果有旧通话，先关闭
                    if (call) {
                        call.close();
                        call = null;
                    }

                    const c = peer.call(ROOM_ID, localStream);
                    setupCall(c);
                    call = c;
                    setStatus('📞 正在呼叫老师...', 'info');
                } catch (err) {
                    console.error('呼叫失败:', err);
                    scheduleReconnect();
                }
            }

            // ============================================================
            //  12. ⭐ 设置通话（修复版 — 确保视频显示）
            // ============================================================
            function setupCall(c) {
                c.on('stream', (stream) => {
                    console.log('📺 收到远程视频流');
                    console.log('   - 视频轨道数:', stream.getVideoTracks().length);
                    console.log('   - 音频轨道数:', stream.getAudioTracks().length);

                    remoteStream = stream;

                    // ⭐ 关键：确保 srcObject 被正确设置
                    remoteVideo.srcObject = stream;

                    // ⭐ 强制播放远程视频
                    remoteVideo.play()
                        .then(() => {
                            console.log('✅ 远程视频播放成功');
                        })
                        .catch(err => {
                            console.warn('⚠️ 远程视频自动播放被阻止，需要用户交互:', err);
                            // 在用户点击时触发播放
                            mainVideo.addEventListener('click', function playOnClick() {
                                remoteVideo.play().catch(e => console.warn('点击播放:', e));
                                mainVideo.removeEventListener('click', playOnClick);
                            }, { once: true });
                            showToast('点击视频区域播放', 'info');
                        });

                    setRemoteOnline(true);
                    remoteLabel.innerHTML =
                        `<i class="fas fa-user"></i> ${myRole === 'teacher' ? '学生' : '老师'}`;
                    setStatus('✅ 已连接！', 'success');
                    isConnected = true;
                    retryCount = 0;
                    showToast('📹 连接已建立！', 'success');
                });

                c.on('close', () => {
                    console.log('📴 通话已结束');
                    remoteVideo.srcObject = null;
                    remoteStream = null;
                    setRemoteOnline(false);
                    remoteLabel.innerHTML = '<i class="fas fa-user"></i> 已断开';
                    isConnected = false;

                    if (myRole === 'teacher') {
                        setStatus('👨‍🏫 等待学生...', 'info');
                        remoteLabel.innerHTML = '<i class="fas fa-user"></i> 等待中...';
                    } else {
                        setStatus('📴 通话已结束，尝试重连...', 'warning');
                        scheduleReconnect();
                    }
                    showToast('对方已离开', 'warning');
                });

                c.on('error', (err) => {
                    console.error('通话错误:', err);
                    setStatus('错误: ' + err.message, 'error');
                    if (myRole === 'student') {
                        scheduleReconnect();
                    }
                });
            }

            // ============================================================
            //  13. 自动重连
            // ============================================================
            function scheduleReconnect() {
                if (myRole !== 'student') return;
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }

                retryCount++;
                if (retryCount > MAX_RETRY) {
                    setStatus('❌ 重连次数过多，请刷新页面', 'error');
                    showToast('无法连接到老师，请刷新页面', 'error');
                    return;
                }

                const delay = Math.min(3000 + retryCount * 1000, 15000);
                console.log(`⏳ 第 ${retryCount} 次重连，等待 ${delay}ms`);

                setStatus(`⏳ 等待老师上线 (${retryCount}/${MAX_RETRY})...`, 'warning');

                reconnectTimer = setTimeout(() => {
                    if (!isConnected && myRole === 'student' && peer) {
                        callTeacher();
                    }
                }, delay);
            }

            // ============================================================
            //  14. 挂断
            // ============================================================
            function hangup() {
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                if (call) { call.close();
                    call = null; }
                if (peer) { peer.destroy();
                    peer = null; }
                if (localStream) { localStream.getTracks().forEach(t => t.stop());
                    localStream = null; }
                if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop());
                    remoteStream = null; }
                isConnected = false;
                setRemoteOnline(false);
                remoteVideo.srcObject = null;
                localVideo.srcObject = null;
                setStatus('📴 已断开', 'warning');
                screenBtn.innerHTML = '<i class="fas fa-desktop"></i> 共享屏幕';
                screenBtn.className = 'ctrl-btn screen';
                isScreenSharing = false;
            }

            // ============================================================
            //  15. 控制按钮
            // ============================================================
            micBtn.addEventListener('click', () => {
                if (!localStream) return;
                const track = localStream.getAudioTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    micBtn.innerHTML = track.enabled ?
                        '<i class="fas fa-microphone"></i> 麦克风' :
                        '<i class="fas fa-microphone-slash"></i> 静音';
                    micBtn.className = track.enabled ? 'ctrl-btn mic' : 'ctrl-btn mic muted';
                }
            });

            camBtn.addEventListener('click', () => {
                if (!localStream) return;
                const track = localStream.getVideoTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    camBtn.innerHTML = track.enabled ?
                        '<i class="fas fa-video"></i> 摄像头' :
                        '<i class="fas fa-video-slash"></i> 关闭';
                    camBtn.className = track.enabled ? 'ctrl-btn cam' : 'ctrl-btn cam off';
                }
            });

            screenBtn.addEventListener('click', async function() {
                if (isScreenSharing) {
                    try {
                        const newStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        const oldAudio = localStream.getAudioTracks()[0];
                        if (oldAudio && oldAudio.kind === 'audio') {
                            const newAudio = newStream.getAudioTracks()[0];
                            if (newAudio) newStream.removeTrack(newAudio);
                            newStream.addTrack(oldAudio);
                        }
                        localStream = newStream;
                        localVideo.srcObject = newStream;
                        localVideo.play().catch(e => console.warn('本地视频播放:', e));
                        if (call) {
                            const sender = call.peerConnection.getSenders().find(s => s.track?.kind === 'video');
                            if (sender) sender.replaceTrack(newStream.getVideoTracks()[0]);
                        }
                        isScreenSharing = false;
                        this.innerHTML = '<i class="fas fa-desktop"></i> 共享屏幕';
                        this.className = 'ctrl-btn screen';
                        showToast('已停止屏幕共享', 'info');
                    } catch (e) {
                        showToast('切换回摄像头失败', 'error');
                    }
                    return;
                }
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            width: { ideal: 1280, max: 1920 },
                            height: { ideal: 720, max: 1080 },
                            frameRate: { ideal: 15, max: 30 }
                        },
                        audio: true
                    });
                    const audioTrack = localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        try { screenStream.addTrack(audioTrack); } catch (e) { /* 忽略 */ }
                    }
                    if (call) {
                        const sender = call.peerConnection.getSenders().find(s => s.track?.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(screenStream.getVideoTracks()[0]);
                            const params = sender.getParameters();
                            if (!params.encodings) params.encodings = [{}];
                            params.encodings[0].maxBitrate = 1500000;
                            await sender.setParameters(params);
                        }
                    }
                    localStream = screenStream;
                    localVideo.srcObject = screenStream;
                    localVideo.play().catch(e => console.warn('本地视频播放:', e));
                    isScreenSharing = true;
                    this.innerHTML = '<i class="fas fa-stop"></i> 停止共享';
                    this.className = 'ctrl-btn screen active';
                    screenStream.getVideoTracks()[0].onended = () => { screenBtn.click(); };
                    showToast('🖥️ 屏幕共享已开启', 'success');
                } catch (e) {
                    console.error('屏幕共享错误:', e);
                    if (e.message.includes('not allowed')) {
                        showToast('屏幕共享被拒绝', 'warning');
                    } else {
                        showToast('错误: ' + e.message, 'error');
                    }
                }
            });

            hangupBtn.addEventListener('click', hangup);

            // ============================================================
            //  16. 启动
            // ============================================================
            updateRoom();
            setStatus('准备加入', 'info');

            window.addEventListener('beforeunload', () => {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                if (peer) peer.destroy();
                if (reconnectTimer) clearTimeout(reconnectTimer);
            });

            initJoin();

        })();
    </script>

</body>
