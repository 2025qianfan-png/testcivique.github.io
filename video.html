<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⛵ 千帆课堂 - 视频会议</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.1/dist/peerjs.min.js">
    </script>
    <style>
        /* ============================================================
               CSS 样式 — 完整保留
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary-blue: #004080;
            --primary-light-blue: #0066cc;
            --primary-yellow: #ffd633;
            --green: #27ae60;
            --red: #e74c3c;
            --gray: #95a5a6;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 16px;
        }
        html,
        body {
            height: 100%;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            background: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        @media (max-width: 480px) {
            .container {
                padding: 0 12px;
            }
        }
        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light-blue));
            color: white;
            padding: 14px 0;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .brand .logo-icon {
            font-size: 1.6rem;
            color: var(--primary-yellow);
        }
        .header .brand h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        .header .brand .sub {
            font-size: 0.6rem;
            opacity: 0.8;
            display: block;
        }
        .header .brand .sub span {
            color: var(--primary-yellow);
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .header .brand h1 {
                font-size: 0.95rem;
            }
            .header .brand .logo-icon {
                font-size: 1.3rem;
            }
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header .info .room {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
        }
        .header .info .user {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
        }
        .header .info .user .tag {
            background: rgba(255, 255, 255, 0.25);
            padding: 1px 6px;
            border-radius: 20px;
            font-size: 0.5rem;
            font-weight: 600;
        }
        .btn-exit {
            background: var(--red);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.6rem;
            transition: all 0.2s;
        }
        .btn-exit:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .header.hidden-fs {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 0 24px 0;
        }
        .join-panel {
            max-width: 400px;
            margin: auto;
            background: white;
            border-radius: var(--radius);
            padding: 32px 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            width: 100%;
        }
        .join-panel .icon {
            font-size: 2.5rem;
            color: var(--primary-yellow);
            margin-bottom: 10px;
        }
        .join-panel h2 {
            color: var(--primary-blue);
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .join-panel p {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 16px;
        }
        .join-panel input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e4e8;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .join-panel input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 64, 128, 0.08);
        }
        .join-panel .btn-join {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-light-blue));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .join-panel .btn-join:hover {
            transform: scale(1.01);
            filter: brightness(0.95);
        }
        .join-panel .hint {
            margin-top: 12px;
            color: #aaa;
            font-size: 0.7rem;
        }
        .join-panel .hint i {
            color: var(--primary-yellow);
        }
        .join-panel .hint .teacher-hint {
            color: var(--primary-yellow);
            font-weight: 600;
            background: rgba(255, 214, 51, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            flex: 1;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8ecf1;
            border-top: 4px solid var(--primary-yellow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading p {
            margin-top: 14px;
            color: #999;
            font-size: 0.85rem;
        }
        #videoRoom {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-video {
            position: relative;
            background: #0f0f1a;
            border-radius: var(--radius);
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 10;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            flex-shrink: 0;
        }
        .main-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #1a1a2e;
        }
        .main-video .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: white;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 5;
            pointer-events: none;
        }
        .main-video .label i {
            color: var(--primary-yellow);
        }
        .main-video .status {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #2ecc71;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }
        .main-video .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .main-video .status.offline {
            color: var(--gray);
        }
        .main-video .status.offline .dot {
            background: var(--gray);
        }
        .main-video:fullscreen,
        .main-video:-webkit-full-screen {
            border-radius: 0 !important;
            aspect-ratio: auto !important;
            height: 100vh !important;
            width: 100vw !important;
            background: #000 !important;
            cursor: default !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 99999 !important;
        }
        .main-video:fullscreen video,
        .main-video:-webkit-full-screen video {
            object-fit: contain !important;
        }
        .main-video:fullscreen .label,
        .main-video:-webkit-full-screen .label {
            font-size: 0.9rem;
            padding: 6px 16px;
        }
        .main-video:fullscreen .status,
        .main-video:-webkit-full-screen .status {
            font-size: 0.75rem;
            padding: 4px 12px;
        }
        .main-video:fullscreen .pip,
        .main-video:-webkit-full-screen .pip {
            width: 200px;
            bottom: 24px;
            right: 24px;
        }
        .pip {
            position: absolute;
            bottom: 14px;
            right: 14px;
            width: 140px;
            aspect-ratio: 4 / 3;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a2e;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.12);
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .pip:hover {
            transform: scale(1.04);
            border-color: var(--primary-yellow);
        }
        .pip video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #1a1a2e;
        }
        .pip .pip-label {
            position: absolute;
            bottom: 4px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 0.5rem;
            color: white;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .pip .pip-label i {
            color: var(--primary-yellow);
            margin-right: 2px;
        }
        @media (max-width: 480px) {
            .pip {
                width: 90px;
            }
            .main-video:fullscreen .pip,
            .main-video:-webkit-full-screen .pip {
                width: 130px;
            }
        }
        .controls {
            background: white;
            border-radius: var(--radius);
            padding: 12px 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }
        .controls .ctrl-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 60px;
            justify-content: center;
            background: #eef0f3;
            color: #333;
        }
        .controls .ctrl-btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }
        .controls .ctrl-btn.mic {
            background: #eef0f3;
            color: #333;
        }
        .controls .ctrl-btn.mic.muted {
            background: #e74c3c;
            color: white;
        }
        .controls .ctrl-btn.cam {
            background: #eef0f3;
            color: #333;
        }
        .controls .ctrl-btn.cam.off {
            background: #e74c3c;
            color: white;
        }
        .controls .ctrl-btn.screen {
            background: var(--green);
            color: white;
        }
        .controls .ctrl-btn.screen.active {
            background: var(--red);
            color: white;
        }
        .controls .ctrl-btn.fullscreen {
            background: #533483;
            color: white;
        }
        .controls .ctrl-btn.fullscreen.active {
            background: #2c3e50;
            color: white;
        }
        .controls .ctrl-btn.hangup {
            background: var(--red);
            color: white;
        }
        @media (max-width: 480px) {
            .controls .ctrl-btn {
                padding: 6px 10px;
                font-size: 0.65rem;
                min-width: 45px;
            }
        }
        .status-bar {
            text-align: center;
            padding: 6px 14px;
            border-radius: var(--radius);
            background: white;
            box-shadow: var(--shadow);
            font-size: 0.75rem;
            color: #666;
            flex-shrink: 0;
        }
        .status-bar .text {
            font-weight: 500;
        }
        .status-bar .text.success {
            color: var(--green);
        }
        .status-bar .text.warning {
            color: #f39c12;
        }
        .status-bar .text.error {
            color: var(--red);
        }
        .status-bar .text.info {
            color: var(--primary-blue);
        }
        .footer {
            background: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 12px 0;
            flex-shrink: 0;
            margin-top: auto;
        }
        .footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.7rem;
        }
        .footer .container .brand-small {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .footer .container .brand-small i {
            color: var(--primary-yellow);
        }
        @media (max-width: 480px) {
            .footer .container {
                flex-direction: column;
                text-align: center;
                font-size: 0.6rem;
            }
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-lg);
            max-width: 320px;
            font-size: 0.8rem;
        }
        @media (max-width: 480px) {
            .toast {
                bottom: 10px;
                right: 10px;
                left: 10px;
                padding: 6px 12px;
                font-size: 0.7rem;
            }
        }
        .toast-success {
            background: var(--green);
        }
        .toast-error {
            background: var(--red);
        }
        .toast-warning {
            background: #f39c12;
        }
        .toast-info {
            background: var(--primary-blue);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header" id="mainHeader">
        <div class="container">
            <div class="brand">
                <span class="logo-icon"><i class="fas fa-sailboat"></i></span>
                <div>
                    <h1>⛵ 千帆课堂</h1>
                    <span class="sub">Association <span>Mille Voiles</span> · 在线课堂</span>
                </div>
            </div>
            <div class="info">
                <span class="room" id="roomDisplay"><i class="fas fa-door-open"></i> <strong id="roomName">加载中...</strong></span>
                <span class="user hidden" id="userBadge">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">-</span>
                    <span class="tag" id="userRole">-</span>
                </span>
                <button class="btn-exit" id="exitBtn"><i class="fas fa-sign-out-alt"></i> 退出</button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container">

        <!-- 加入面板 -->
        <div id="joinPanel" class="join-panel">
            <div class="icon"><i class="fas fa-sailboat"></i></div>
            <h2>⛵ 千帆课堂</h2>
            <p>输入你的名字进入课堂</p>
            <input type="text" id="nameInput" placeholder="你的名字" maxlength="30">
            <button class="btn-join" id="joinBtn"><i class="fas fa-video"></i> 进入</button>
            <div class="hint">
                <i class="fas fa-info-circle"></i>
                输入 <span class="teacher-hint">millevoiles</span> 成为老师，其他名字为学生
            </div>
        </div>

        <!-- 加载 -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingText">⏳ 连接中...</p>
        </div>

        <!-- 视频房间 -->
        <div id="videoRoom" class="hidden">

            <div class="main-video" id="mainVideo">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label" id="remoteLabel">
                    <i class="fas fa-user"></i> 等待中...
                </div>
                <div class="status offline" id="remoteStatus">
                    <span class="dot"></span> 未连接
                </div>

                <div class="pip" id="pipWrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="pip-label"><i class="fas fa-user"></i> <span id="localLabel">我</span></div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn mic" id="micBtn"><i class="fas fa-microphone"></i> 麦克风</button>
                <button class="ctrl-btn cam" id="camBtn"><i class="fas fa-video"></i> 摄像头</button>
                <button class="ctrl-btn screen" id="screenBtn"><i class="fas fa-desktop"></i> 共享屏幕</button>
                <button class="ctrl-btn fullscreen" id="fsControlBtn">
                    <i class="fas fa-expand"></i> 全屏
                </button>
                <button class="ctrl-btn hangup" id="hangupBtn"><i class="fas fa-phone-slash"></i> 挂断</button>
            </div>

            <div class="status-bar">
                <span class="text info" id="statusText">就绪</span>
            </div>
        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <span class="brand-small"><i class="fas fa-sailboat"></i> ⛵ 千帆课堂 · Association Mille Voiles</span>
            <span>&copy; 2025 保留所有权利</span>
        </div>
    </footer>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT — 完整重写 ===== -->
    <!-- ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. 配置常量
            // ============================================================
            const CONFIG = {
                ROOM_ID: 'mille-voiles-classroom',
                TEACHER_NAME: 'millevoiles',
                MAX_RETRY: 10,
                PEER: {
                    debug: 2,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' },
                            { urls: 'stun:stun2.l.google.com:19302' },
                            { urls: 'stun:stun3.l.google.com:19302' },
                            { urls: 'stun:stun4.l.google.com:19302' },
                            {
                                urls: [
                                    'turn:openrelay.metered.ca:80',
                                    'turn:openrelay.metered.ca:443',
                                    'turn:openrelay.metered.ca:443?transport=tcp'
                                ],
                                username: 'openrelayproject',
                                credential: 'openrelayproject'
                            },
                            {
                                urls: [
                                    'turn:turn.xirsys.com:3478?transport=udp',
                                    'turn:turn.xirsys.com:3478?transport=tcp',
                                    'turn:turn.xirsys.com:443?transport=tcp'
                                ],
                                username: 'f3f5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5',
                                credential: 'f3f5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5'
                            }
                        ],
                        iceCandidatePoolSize: 10,
                        bundlePolicy: 'max-bundle',
                        rtcpMuxPolicy: 'require'
                    }
                }
            };

            // ============================================================
            //  2. DOM 引用
            // ============================================================
            const $ = (id) => document.getElementById(id);

            const DOM = {
                joinPanel: $('joinPanel'),
                loading: $('loading'),
                loadingText: $('loadingText'),
                videoRoom: $('videoRoom'),
                nameInput: $('nameInput'),
                joinBtn: $('joinBtn'),
                roomDisplay: $('roomDisplay'),
                exitBtn: $('exitBtn'),
                userBadge: $('userBadge'),
                userName: $('userName'),
                userRole: $('userRole'),
                localVideo: $('localVideo'),
                remoteVideo: $('remoteVideo'),
                localLabel: $('localLabel'),
                remoteLabel: $('remoteLabel'),
                remoteStatus: $('remoteStatus'),
                statusText: $('statusText'),
                micBtn: $('micBtn'),
                camBtn: $('camBtn'),
                screenBtn: $('screenBtn'),
                fsControlBtn: $('fsControlBtn'),
                hangupBtn: $('hangupBtn'),
                mainVideo: $('mainVideo'),
                mainHeader: $('mainHeader'),
            };

            // ============================================================
            //  3. 状态管理
            // ============================================================
            const State = {
                peer: null,
                call: null,
                localStream: null,
                remoteStream: null,
                isScreenSharing: false,
                role: null, // 'teacher' | 'student'
                name: '',
                isConnected: false,
                isCalling: false,
                reconnectTimer: null,
                retryCount: 0,
                isFullscreen: false,
                remoteStreamReceived: false, // 防止重复处理 stream 事件
            };

            // ============================================================
            //  4. UI 工具函数
            // ============================================================
            function setStatus(text, type) {
                DOM.statusText.textContent = text;
                DOM.statusText.className = 'text ' + (type || 'info');
            }

            function setRemoteOnline(online) {
                if (online) {
                    DOM.remoteStatus.className = 'status';
                    DOM.remoteStatus.innerHTML = '<span class="dot"></span> 已连接';
                } else {
                    DOM.remoteStatus.className = 'status offline';
                    DOM.remoteStatus.innerHTML = '<span class="dot"></span> 未连接';
                }
            }

            function showToast(msg, type) {
                const old = document.querySelector('.toast');
                if (old) old.remove();
                const el = document.createElement('div');
                el.className = 'toast toast-' + (type || 'info');
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }

            function updateRoom() {
                DOM.roomDisplay.innerHTML =
                    `<i class="fas fa-door-open"></i> 房间: <strong>${CONFIG.ROOM_ID}</strong>`;
            }

            function updateUser(name, role) {
                DOM.userBadge.classList.remove('hidden');
                DOM.userName.textContent = name;
                const labels = { teacher: '👨‍🏫 老师', student: '🎓 学生' };
                DOM.userRole.textContent = labels[role] || role;
                DOM.userRole.style.background = role === 'teacher' ? 'rgba(255,214,51,0.3)' :
                    'rgba(46,204,113,0.3)';
            }

            // ============================================================
            //  5. 全屏功能
            // ============================================================
            function toggleFullscreen() {
                const el = DOM.mainVideo;
                const isFS = document.fullscreenElement ||
                    document.webkitFullscreenElement ||
                    (el.webkitDisplayingFullscreen !== undefined && el.webkitDisplayingFullscreen);

                if (!isFS) {
                    try {
                        if (el.requestFullscreen) {
                            el.requestFullscreen().then(() => {
                                DOM.mainHeader.classList.add('hidden-fs');
                                updateFSButton(true);
                            }).catch(() => {});
                        } else if (el.webkitRequestFullscreen) {
                            el.webkitRequestFullscreen();
                            DOM.mainHeader.classList.add('hidden-fs');
                            updateFSButton(true);
                        } else {
                            const video = el.querySelector('video');
                            if (video && video.webkitEnterFullscreen) {
                                video.webkitEnterFullscreen();
                                DOM.mainHeader.classList.add('hidden-fs');
                                updateFSButton(true);
                            } else {
                                showToast('您的浏览器不支持全屏', 'warning');
                            }
                        }
                    } catch (e) {
                        const video = el.querySelector('video');
                        if (video && video.webkitEnterFullscreen) {
                            video.webkitEnterFullscreen();
                            DOM.mainHeader.classList.add('hidden-fs');
                            updateFSButton(true);
                        } else {
                            showToast('错误: ' + e.message, 'error');
                        }
                    }
                } else {
                    try {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                        else {
                            const video = el.querySelector('video');
                            if (video && video.webkitExitFullscreen) video.webkitExitFullscreen();
                        }
                        DOM.mainHeader.classList.remove('hidden-fs');
                        updateFSButton(false);
                    } catch (e) {
                        DOM.mainHeader.classList.remove('hidden-fs');
                        updateFSButton(false);
                    }
                }
            }

            function updateFSButton(isFS) {
                State.isFullscreen = isFS;
                if (isFS) {
                    DOM.fsControlBtn.innerHTML = '<i class="fas fa-compress"></i> 退出';
                    DOM.fsControlBtn.classList.add('active');
                } else {
                    DOM.fsControlBtn.innerHTML = '<i class="fas fa-expand"></i> 全屏';
                    DOM.fsControlBtn.classList.remove('active');
                }
            }

            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    DOM.mainHeader.classList.remove('hidden-fs');
                    updateFSButton(false);
                }
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement) {
                    DOM.mainHeader.classList.remove('hidden-fs');
                    updateFSButton(false);
                }
            });

            DOM.fsControlBtn.addEventListener('click', toggleFullscreen);
            DOM.mainVideo.addEventListener('dblclick', toggleFullscreen);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && (document.fullscreenElement || document.webkitFullscreenElement)) {
                    DOM.mainHeader.classList.remove('hidden-fs');
                    updateFSButton(false);
                }
            });

            // ============================================================
            //  6. URL 参数处理
            // ============================================================
            function getURLParam(name) {
                return new URLSearchParams(window.location.search).get(name);
            }

            function decodeToken() {
                const token = getURLParam('token');
                if (!token) return null;
                try {
                    return JSON.parse(decodeURIComponent(atob(token)));
                } catch (e) { return null; }
            }

            function getRoleFromToken(token) {
                if (!token) return null;
                if (token.role === 'teacher' || token.role === 'student') return token.role;
                if (token.teacherId || token.teacher_id) return 'teacher';
                if (token.studentId || token.student_id || token.userId) return 'student';
                return null;
            }

            function getNameFromToken(token) {
                if (!token) return null;
                return token.name || token.userName || token.studentName || '用户';
            }

            // ============================================================
            //  7. 加入逻辑
            // ============================================================
            function initJoin() {
                // 优先处理 token
                const tokenData = decodeToken();
                if (tokenData) {
                    const role = getRoleFromToken(tokenData);
                    const name = getNameFromToken(tokenData);
                    if (role && name) {
                        State.name = name;
                        State.role = role;
                        enterRoom();
                        return;
                    }
                }

                // URL 强制指定角色
                const forceRole = getURLParam('role');
                if (forceRole === 'teacher' || forceRole === 'student') {
                    State.role = forceRole;
                    State.name = forceRole === 'teacher' ? '老师' : '学生';
                    enterRoom();
                    return;
                }

                // 显示加入面板
                DOM.joinPanel.classList.remove('hidden');
                DOM.loading.classList.add('hidden');
                DOM.videoRoom.classList.add('hidden');
                DOM.userBadge.classList.add('hidden');
            }

            DOM.joinBtn.addEventListener('click', () => {
                const name = DOM.nameInput.value.trim();
                if (!name) {
                    showToast('请输入你的名字', 'warning');
                    return;
                }

                State.name = name;
                State.role = (name.toLowerCase() === CONFIG.TEACHER_NAME.toLowerCase()) ? 'teacher' : 'student';

                enterRoom();
            });

            DOM.nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') DOM.joinBtn.click();
            });

            DOM.exitBtn.addEventListener('click', () => {
                if (confirm('确定要退出课堂吗？')) {
                    hangup();
                    window.location.href = window.location.pathname;
                }
            });

            function enterRoom() {
                DOM.joinPanel.classList.add('hidden');
                DOM.videoRoom.classList.remove('hidden');
                DOM.localLabel.textContent = State.name;
                updateRoom();
                updateUser(State.name, State.role);

                if (State.role === 'teacher') {
                    showToast('👨‍🏫 欢迎老师！', 'success');
                    setStatus('👨‍🏫 以老师身份进入...', 'info');
                } else {
                    showToast('🎓 欢迎同学！', 'info');
                    setStatus('🎓 以学生身份进入...', 'info');
                }

                startPeer();
            }

            // ============================================================
            //  8. PeerJS 核心
            // ============================================================
            function startPeer() {
                const peerId = (State.role === 'teacher') ? CONFIG.ROOM_ID : undefined;
                setStatus('连接到服务器...', 'info');

                if (State.peer) {
                    State.peer.destroy();
                    State.peer = null;
                }

                State.peer = new Peer(peerId, CONFIG.PEER);

                State.peer.on('open', (id) => {
                    console.log('✅ Peer 已打开, ID:', id, '角色:', State.role);
                    State.retryCount = 0;

                    if (State.role === 'teacher') {
                        setupTeacher();
                    } else {
                        setupStudent();
                    }
                });

                State.peer.on('error', (err) => {
                    console.error('❌ Peer 错误:', err.type, err.message);

                    switch (err.type) {
                        case 'unavailable-id':
                            if (State.role === 'teacher') {
                                setStatus('⚠️ 已有一位老师，请用其他名字作为学生进入', 'error');
                                showToast('老师已在线，请用其他名字作为学生进入', 'error');
                            }
                            break;
                        case 'peer-unavailable':
                            if (State.role === 'student') {
                                setStatus('⏳ 老师不在线，等待中...', 'warning');
                                showToast('老师不在线，等待中...', 'warning');
                                scheduleReconnect();
                            }
                            break;
                        case 'network':
                        case 'server':
                            setStatus('⚠️ 网络错误，尝试重连...', 'warning');
                            scheduleReconnect();
                            break;
                        default:
                            setStatus('错误: ' + err.message, 'error');
                            showToast('错误: ' + err.message, 'error');
                    }
                });

                State.peer.on('disconnected', () => {
                    console.log('⚠️ Peer 断开连接');
                    setStatus('⚠️ 连接断开，尝试重连...', 'warning');
                    if (State.peer) {
                        State.peer.reconnect();
                    }
                });

                State.peer.on('close', () => {
                    console.log('📴 Peer 已关闭');
                });
            }

            // ============================================================
            //  9. 老师设置
            // ============================================================
            function setupTeacher() {
                setStatus('📷 正在打开摄像头...', 'info');

                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        State.localStream = stream;
                        DOM.localVideo.srcObject = stream;
                        DOM.localVideo.play().catch(e => console.warn('本地视频播放:', e));
                        console.log('✅ 老师摄像头已就绪');

                        // ⭐ 老师监听来电
                        State.peer.on('call', (incoming) => {
                            console.log('📞 收到学生来电！');

                            // 关闭旧通话
                            if (State.call) {
                                State.call.close();
                                State.call = null;
                            }

                            DOM.remoteLabel.innerHTML = '<i class="fas fa-user"></i> 学生';
                            setRemoteOnline(true);
                            setStatus('✅ 已连接学生', 'success');
                            showToast('🎓 有学生加入了课堂！', 'success');

                            if (State.localStream) {
                                incoming.answer(State.localStream);
                                setupCall(incoming);
                                State.call = incoming;
                            } else {
                                // 兜底
                                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                                    .then(s => {
                                        State.localStream = s;
                                        DOM.localVideo.srcObject = s;
                                        DOM.localVideo.play().catch(e => console.warn('本地视频播放:', e));
                                        incoming.answer(s);
                                        setupCall(incoming);
                                        State.call = incoming;
                                    })
                                    .catch(err => {
                                        setStatus('❌ 摄像头获取失败', 'error');
                                        showToast('无法获取摄像头', 'error');
                                    });
                            }
                        });

                        setStatus('👨‍🏫 老师在线，等待学生加入...', 'info');
                    })
                    .catch(err => {
                        console.error('老师摄像头错误:', err);
                        setStatus('❌ 无法访问摄像头，仅音频模式', 'warning');
                        showToast('请授权摄像头和麦克风权限', 'warning');

                        // 无摄像头降级
                        State.peer.on('call', (incoming) => {
                            console.log('📞 收到来电（无摄像头模式）');

                            if (State.call) {
                                State.call.close();
                                State.call = null;
                            }

                            try {
                                const audioCtx = new AudioContext();
                                const dest = audioCtx.createMediaStreamDestination();
                                State.localStream = dest.stream;
                                DOM.localVideo.srcObject = dest.stream;
                                incoming.answer(dest.stream);
                                setupCall(incoming);
                                State.call = incoming;
                                setStatus('⚠️ 无摄像头，音频模式', 'warning');
                                showToast('摄像头不可用，仅音频模式', 'warning');
                            } catch (e) {
                                showToast('无法建立连接', 'error');
                            }
                        });
                        setStatus('👨‍🏫 老师在线（无摄像头），等待学生...', 'info');
                    });
            }

            // ============================================================
            //  10. 学生设置
            // ============================================================
            function setupStudent() {
                setStatus('📷 正在打开摄像头...', 'info');

                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(stream => {
                        State.localStream = stream;
                        DOM.localVideo.srcObject = stream;
                        DOM.localVideo.play().catch(e => console.warn('本地视频播放:', e));
                        console.log('✅ 学生摄像头已就绪');

                        setStatus('📞 正在呼叫老师...', 'info');
                        callTeacher();
                    })
                    .catch(err => {
                        console.error('学生摄像头错误:', err);
                        setStatus('❌ 无法访问摄像头，仅音频模式', 'warning');
                        showToast('请授权摄像头和麦克风权限', 'warning');

                        try {
                            const audioCtx = new AudioContext();
                            const dest = audioCtx.createMediaStreamDestination();
                            State.localStream = dest.stream;
                            DOM.localVideo.srcObject = dest.stream;
                            setStatus('📞 正在呼叫老师（仅音频）...', 'info');
                            callTeacher();
                        } catch (e) {
                            setStatus('❌ 无法建立连接', 'error');
                            showToast('无法访问摄像头和麦克风', 'error');
                        }
                    });
            }

            // ============================================================
            //  11. 学生呼叫老师（防重复）
            // ============================================================
            function callTeacher() {
                if (State.isCalling || State.isConnected) {
                    console.log('⏳ 已有呼叫进行中或已连接，跳过');
                    return;
                }

                if (!State.peer) {
                    scheduleReconnect();
                    return;
                }

                if (!State.peer.id) {
                    setStatus('⏳ 等待连接建立...', 'info');
                    setTimeout(() => callTeacher(), 1000);
                    return;
                }

                console.log('📞 呼叫老师:', CONFIG.ROOM_ID);
                State.isCalling = true;

                try {
                    if (State.call) {
                        State.call.close();
                        State.call = null;
                    }

                    const c = State.peer.call(CONFIG.ROOM_ID, State.localStream);
                    setupCall(c);
                    State.call = c;
                    setStatus('📞 正在呼叫老师...', 'info');
                } catch (err) {
                    console.error('呼叫失败:', err);
                    State.isCalling = false;
                    scheduleReconnect();
                }
            }

            // ============================================================
            //  12. ⭐ 设置通话（稳健版）
            // ============================================================
            function setupCall(c) {
                // 重置远程流接收标志
                State.remoteStreamReceived = false;

                c.on('stream', (stream) => {
                    // 防止重复处理
                    if (State.remoteStreamReceived) {
                        console.log('⚠️ 忽略重复的远程视频流');
                        return;
                    }
                    State.remoteStreamReceived = true;

                    console.log('📺 收到远程视频流');
                    console.log('   - 视频轨道数:', stream.getVideoTracks().length);
                    console.log('   - 音频轨道数:', stream.getAudioTracks().length);

                    State.remoteStream = stream;

                    // ⭐ 关键：重置视频元素状态
                    DOM.remoteVideo.pause();
                    DOM.remoteVideo.srcObject = null;

                    // 使用 requestAnimationFrame 确保 DOM 更新
                    requestAnimationFrame(() => {
                        DOM.remoteVideo.srcObject = stream;

                        // 处理播放
                        const playPromise = DOM.remoteVideo.play();

                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => {
                                    console.log('✅ 远程视频播放成功');
                                    setRemoteOnline(true);
                                    DOM.remoteLabel.innerHTML =
                                        `<i class="fas fa-user"></i> ${State.role === 'teacher' ? '学生' : '老师'}`;
                                    setStatus('✅ 已连接！', 'success');
                                    State.isConnected = true;
                                    State.isCalling = false;
                                    State.retryCount = 0;
                                    showToast('📹 连接已建立！', 'success');
                                })
                                .catch(error => {
                                    console.warn('⚠️ 远程视频播放被阻止:', error.name, error.message);

                                    if (error.name === 'AbortError') {
                                        console.log('ℹ️ 播放请求被中断，视频将在稍后恢复');
                                        setTimeout(() => {
                                            DOM.remoteVideo.play().catch(e => console.warn(
                                            '重试播放失败:', e));
                                        }, 500);
                                        return;
                                    }

                                    // 其他错误：提示用户点击播放
                                    setRemoteOnline(true);
                                    setStatus('⚠️ 点击视频区域以播放', 'warning');
                                    showToast('点击视频画面开始播放', 'info');

                                    const playOnClick = () => {
                                        DOM.remoteVideo.play()
                                            .then(() => {
                                                console.log('✅ 用户点击后播放成功');
                                                setStatus('✅ 已连接！', 'success');
                                            })
                                            .catch(e => console.warn('用户点击后播放仍失败:', e));
                                        DOM.mainVideo.removeEventListener('click', playOnClick);
                                    };
                                    DOM.mainVideo.addEventListener('click', playOnClick, { once: true });
                                });
                        }
                    });

                    // 更新 UI
                    setRemoteOnline(true);
                    DOM.remoteLabel.innerHTML =
                        `<i class="fas fa-user"></i> ${State.role === 'teacher' ? '学生' : '老师'}`;
                });

                c.on('close', () => {
                    console.log('📴 通话已结束');
                    State.remoteStreamReceived = false;
                    DOM.remoteVideo.srcObject = null;
                    State.remoteStream = null;
                    setRemoteOnline(false);
                    DOM.remoteLabel.innerHTML = '<i class="fas fa-user"></i> 已断开';
                    State.isConnected = false;
                    State.isCalling = false;

                    if (State.role === 'teacher') {
                        setStatus('👨‍🏫 等待学生...', 'info');
                        DOM.remoteLabel.innerHTML = '<i class="fas fa-user"></i> 等待中...';
                    } else {
                        setStatus('📴 通话已结束，尝试重连...', 'warning');
                        scheduleReconnect();
                    }
                    showToast('对方已离开', 'warning');
                });

                c.on('error', (err) => {
                    console.error('通话错误:', err);
                    State.remoteStreamReceived = false;
                    State.isCalling = false;
                    setStatus('错误: ' + err.message, 'error');
                    if (State.role === 'student') {
                        scheduleReconnect();
                    }
                });
            }

            // ============================================================
            //  13. 自动重连
            // ============================================================
            function scheduleReconnect() {
                if (State.role !== 'student') return;
                if (State.reconnectTimer) {
                    clearTimeout(State.reconnectTimer);
                    State.reconnectTimer = null;
                }

                State.retryCount++;
                if (State.retryCount > CONFIG.MAX_RETRY) {
                    setStatus('❌ 重连次数过多，请刷新页面', 'error');
                    showToast('无法连接到老师，请刷新页面', 'error');
                    return;
                }

                const delay = Math.min(3000 + State.retryCount * 1000, 15000);
                console.log(`⏳ 第 ${State.retryCount} 次重连，等待 ${delay}ms`);

                setStatus(`⏳ 等待老师上线 (${State.retryCount}/${CONFIG.MAX_RETRY})...`, 'warning');

                State.reconnectTimer = setTimeout(() => {
                    if (!State.isConnected && State.role === 'student' && State.peer) {
                        State.isCalling = false; // 重置呼叫状态
                        callTeacher();
                    }
                }, delay);
            }

            // ============================================================
            //  14. 挂断
            // ============================================================
            function hangup() {
                if (State.reconnectTimer) {
                    clearTimeout(State.reconnectTimer);
                    State.reconnectTimer = null;
                }

                if (State.call) {
                    State.call.close();
                    State.call = null;
                }

                if (State.peer) {
                    State.peer.destroy();
                    State.peer = null;
                }

                if (State.localStream) {
                    State.localStream.getTracks().forEach(t => t.stop());
                    State.localStream = null;
                }

                if (State.remoteStream) {
                    State.remoteStream.getTracks().forEach(t => t.stop());
                    State.remoteStream = null;
                }

                State.isConnected = false;
                State.isCalling = false;
                State.remoteStreamReceived = false;
                setRemoteOnline(false);
                DOM.remoteVideo.srcObject = null;
                DOM.localVideo.srcObject = null;
                setStatus('📴 已断开', 'warning');
                DOM.screenBtn.innerHTML = '<i class="fas fa-desktop"></i> 共享屏幕';
                DOM.screenBtn.className = 'ctrl-btn screen';
                State.isScreenSharing = false;
            }

            // ============================================================
            //  15. 控制按钮
            // ============================================================
            DOM.micBtn.addEventListener('click', () => {
                if (!State.localStream) return;
                const track = State.localStream.getAudioTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    DOM.micBtn.innerHTML = track.enabled ?
                        '<i class="fas fa-microphone"></i> 麦克风' :
                        '<i class="fas fa-microphone-slash"></i> 静音';
                    DOM.micBtn.className = track.enabled ? 'ctrl-btn mic' : 'ctrl-btn mic muted';
                }
            });

            DOM.camBtn.addEventListener('click', () => {
                if (!State.localStream) return;
                const track = State.localStream.getVideoTracks()[0];
                if (track) {
                    track.enabled = !track.enabled;
                    DOM.camBtn.innerHTML = track.enabled ?
                        '<i class="fas fa-video"></i> 摄像头' :
                        '<i class="fas fa-video-slash"></i> 关闭';
                    DOM.camBtn.className = track.enabled ? 'ctrl-btn cam' : 'ctrl-btn cam off';
                }
            });

            DOM.screenBtn.addEventListener('click', async function() {
                if (State.isScreenSharing) {
                    try {
                        const newStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        const oldAudio = State.localStream.getAudioTracks()[0];
                        if (oldAudio && oldAudio.kind === 'audio') {
                            const newAudio = newStream.getAudioTracks()[0];
                            if (newAudio) newStream.removeTrack(newAudio);
                            newStream.addTrack(oldAudio);
                        }
                        State.localStream = newStream;
                        DOM.localVideo.srcObject = newStream;
                        DOM.localVideo.play().catch(e => console.warn('本地视频播放:', e));
                        if (State.call) {
                            const sender = State.call.peerConnection.getSenders().find(s => s.track?.kind ===
                            'video');
                            if (sender) sender.replaceTrack(newStream.getVideoTracks()[0]);
                        }
                        State.isScreenSharing = false;
                        this.innerHTML = '<i class="fas fa-desktop"></i> 共享屏幕';
                        this.className = 'ctrl-btn screen';
                        showToast('已停止屏幕共享', 'info');
                    } catch (e) {
                        showToast('切换回摄像头失败', 'error');
                    }
                    return;
                }

                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            width: { ideal: 1280, max: 1920 },
                            height: { ideal: 720, max: 1080 },
                            frameRate: { ideal: 15, max: 30 }
                        },
                        audio: true
                    });

                    const audioTrack = State.localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        try { screenStream.addTrack(audioTrack); } catch (e) { /* 忽略 */ }
                    }

                    if (State.call) {
                        const sender = State.call.peerConnection.getSenders().find(s => s.track?.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(screenStream.getVideoTracks()[0]);
                            const params = sender.getParameters();
                            if (!params.encodings) params.encodings = [{}];
                            params.encodings[0].maxBitrate = 1500000;
                            await sender.setParameters(params);
                        }
                    }

                    State.localStream = screenStream;
                    DOM.localVideo.srcObject = screenStream;
                    DOM.localVideo.play().catch(e => console.warn('本地视频播放:', e));
                    State.isScreenSharing = true;
                    this.innerHTML = '<i class="fas fa-stop"></i> 停止共享';
                    this.className = 'ctrl-btn screen active';

                    screenStream.getVideoTracks()[0].onended = () => {
                        DOM.screenBtn.click();
                    };

                    showToast('🖥️ 屏幕共享已开启', 'success');
                } catch (e) {
                    console.error('屏幕共享错误:', e);
                    showToast(e.message.includes('not allowed') ? '屏幕共享被拒绝' : '错误: ' + e.message, 'error');
                }
            });

            DOM.hangupBtn.addEventListener('click', hangup);

            // ============================================================
            //  16. 启动应用
            // ============================================================
            updateRoom();
            setStatus('准备加入', 'info');

            window.addEventListener('beforeunload', () => {
                if (State.localStream) State.localStream.getTracks().forEach(t => t.stop());
                if (State.peer) State.peer.destroy();
                if (State.reconnectTimer) clearTimeout(State.reconnectTimer);
            });

            initJoin();

        })();
    </script>

</body>
</html>
