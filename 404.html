<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable · Mille Voiles</title>
  <link rel="stylesheet" href="index_style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    .error-page {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }
    .error-code {
      font-family: 'Montserrat', sans-serif;
      font-size: 6rem;
      font-weight: 900;
      color: var(--brand);
      line-height: 1;
      margin-bottom: 10px;
      letter-spacing: -4px;
    }
    .error-page h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    .error-page p {
      color: var(--text-light);
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto 28px;
      line-height: 1.7;
    }
    .error-page .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 30px;
      border-radius: 50px;
      background: var(--brand-gradient);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: var(--transition);
      box-shadow: 0 6px 20px rgba(26, 42, 92, 0.25);
    }
    .error-page .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(26, 42, 92, 0.30);
    }
  </style>
</head>
<body>

<header class="main-header">
  <div class="container">
    <div class="header-inner">
      <div class="header-logo">
        <img src="icons/logo.png" alt="Mille Voiles" class="header-logo-img" onerror="this.style.display='none'">
      </div>
      <div class="header-title">
        <h1>Association Mille Voiles</h1>
        <p class="subhead">Intégration · Formation · Innovation</p>
      </div>
    </div>
  </div>
</header>

<section class="error-page">
  <div>
    <div class="error-code">404</div>
    <h1>Page introuvable</h1>
    <p>La page que vous recherchez n'existe pas, a été déplacée ou est temporairement indisponible.</p>
    <a href="index.html" class="btn-primary">
      <i class="fas fa-home"></i> Retour à l'accueil
    </a>
  </div>
</section>

<footer class="main-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top: none; margin-top: 0;">
      <span>© 2025-2026 Mille Voiles · Tous droits réservés</span>
      <span class="sep">|</span>
      <a href="mentions-legales.html">Mentions légales</a>
      <span class="sep">|</span>
      <a href="confidentialite.html">Politique de confidentialité</a>
    </div>
  </div>
</footer>

</body>
</html>
